flow: fast
description: |
  Fast flow, Margi-style: from the chosen change to the PR, with minimal ceremony.
  The orchestrator picks the next change and plans it; readiness gate; implementation
  with TDD; review; PR; and the human merge gate. No brainstorm nor full panel —
  for small, reversible work where practicality matters more than rigor.
  `agent` steps pause for Claude to dispatch the skill/subagent (inversion of
  control) and resume with the outcome.
version: 1

inputs:
  - name: request
    type: string
    required: true
    description: Free-form description of the change to build (or the change-id if a backlog already exists).
  - name: mode
    type: enum
    values:
      - build
      - register
    default: build
    description: build = the full pipeline; register = park a debit (roadmap entry + paused flow), no plan/implement.

steps:
  - id: route_mode
    type: runs
    description: Routes by mode. register → verify + park; build (default) → the existing pipeline, unchanged.
    command: "test \"${inputs.mode}\" = register"
    on_success: check_registered
    on_failure: select

  - id: check_registered
    type: runs
    description: |
      REGISTRATION LEASH — the flow refuses to park an id the roadmap does not
      declare. Also structurally rejects a raw free-form sentence leaking into
      request (a sentence never matches a declared kebab-case change-id), which
      is what keeps ${inputs.request} paths clean downstream. ${inputs.request}
      is QUOTED (same idiom as route_mode above): unquoted, a multi-word
      request word-splits in `bash -lc` and --change only reads its first
      token, so a request whose FIRST word happens to be a declared id would
      falsely pass the leash with the rest of the sentence silently dropped.
    command: "node \"$AIDAKIT_GOVERNANCE/validators/derive-roadmap-status.js\" --change \"${inputs.request}\""
    on_success: parked
    on_failure: aborted

  - id: parked
    type: human_gate
    description: THE PARK — a registered debit. Resumable across sessions; nothing runs until resumed.
    prompt: |
      Debit registered: "${inputs.request}" is declared on the roadmap (backlog)
      and this flow is PARKED. Nothing is planned or implemented until you resume.
        plan    → continue into planning (select → plan → …)
        discard → abort this parked flow (the roadmap entry stays declared)
    options:
      - plan
      - discard
    on_result:
      plan: select
      discard: aborted

  - id: select
    type: invoke
    description: |
      aidakit:orchestrator — picks/confirms the change ready to build. Detects the
      tracking mode (OpenSpec in openspec/changes/ or docs/features/), inspects
      the active changes, runs git log for the repo state, checks the archive
      (openspec/changes/archive/ or docs/archive/) and the cited dependencies, and picks
      the first ready change whose plan artifacts validate and whose dependencies have
      already been delivered. If the request already carries a change-id, it confirms it
      instead of selecting. Reports the resolved change-id back as the change_id
      output (resume ... success change_id=<kebab-case-id>): every downstream
      .aidakit/tasks/... path keys on ${context.select.change_id}, never on the
      free-form ${inputs.request}.
    invoke_target: aidakit:orchestrator
    input:
      request: "${inputs.request}"
    expects:
      - success
      - failure
    outputs:
      success:
        - change_id
    on_success: plan
    on_failure: aborted

  - id: plan
    type: invoke
    description: aidakit:plan — plans the chosen change (implementation plan).
    invoke_target: aidakit:plan
    input:
      request: "${inputs.request}"
      change_id: "${context.select.change_id}"
    expects:
      - success
      - failure
    on_success: readiness
    on_failure: aborted

  - id: readiness
    type: invoke
    description: aidakit:readiness — GATE 1, readiness review of the plan before coding.
    invoke_target: aidakit:readiness
    expects:
      - approved
      - needs-revision
      - blocked
    on_result:
      approved: implement
      needs-revision: plan
      blocked: aborted

  - id: implement
    type: invoke
    description: Implementation with TDD (skill test-driven-development) + aidakit:test.
    invoke_target: aidakit:implement
    expects:
      - success
      - failure
    on_success: check_implement_bench
    on_failure: aborted

  - id: check_implement_bench
    type: runs
    description: |
      PARALLELISM LEASH, conditional — a single-surface change never writes a
      bench="implement" record to .aidakit/tasks/<change-id>/bench.ndjson
      (there's nothing to parallelize; the file may still exist for the review
      bench that runs later), so this step SKIPS the leash when no "implement"
      record is present (exit 0). When the orchestrator routed a multi-surface
      change in parallel mode, aidakit:implement wrote the bench manifest +
      per-surface verdicts under bench="implement", and check-bench.js verifies
      the same three things as the review bench: every manifested surface
      reported, the consensus matches what aidakit:implement reported, and the
      dispatch was genuinely parallel. The path keys on
      ${context.select.change_id} — the id select reported — never on the
      free-form request.
    command: "test ! -f \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" || ! grep -q '\"bench\":\"implement\"' \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" || node \"$AIDAKIT_GOVERNANCE/validators/check-bench.js\" \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" --bench implement --outcome success"
    on_success: review
    on_failure: implement

  - id: review
    type: invoke
    description: aidakit:review on the diff — conformance with specs/ADRs + bug hunting.
    invoke_target: aidakit:review
    expects:
      - pass
      - fail
    on_result:
      pass: check_review_bench
      fail: check_review_bench

  - id: check_review_bench
    type: runs
    description: |
      PARALLELISM LEASH — check-bench mechanically verifies the review bench:
      every role the __manifest__ record committed to (written BEFORE dispatch)
      reported exactly once; the mechanical consensus derived from the roles'
      own verdicts matches what aidakit:review reported; and the roles'
      dispatch/return windows genuinely overlap (real parallel dispatch, not
      sequential). exit 0 (gate released) proceeds per the reported outcome;
      exit≠0 (leash violation) goes back to review to redo the round properly —
      a bench that skipped a role, invented a consensus, or ran sequentially
      never reaches document.
    command: "node \"$AIDAKIT_GOVERNANCE/validators/check-bench.js\" \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" --bench review --outcome \"${context.review.outcome}\""
    on_success: review_outcome
    on_failure: review

  - id: review_outcome
    type: runs
    description: Routes on the bench's own reported outcome now that check_review_bench has verified it mechanically.
    command: "test \"${context.review.outcome}\" = pass"
    on_success: document
    on_failure: implement

  - id: document
    type: invoke
    description: |
      aidakit:doc-planner — DOC-LEASH. Builds/updates the manifest of required
      documents for the change (.aidakit/tasks/${context.select.change_id}/doc-manifest.json)
      and dispatches the fronts that fill in the missing docs. Decides the rigor (what is
      required, under which condition and kind); the truth remains the disk.
    invoke_target: aidakit:doc-planner
    input:
      request: "${inputs.request}"
      change_id: "${context.select.change_id}"
    expects:
      - success
      - failure
    on_success: check_docs
    on_failure: aborted

  - id: check_docs
    type: runs
    description: |
      LEASH GATE — check-doc-manifest verifies item by item and LOCKS the flow
      until the list is 100%. exit 0 (gate released) proceeds to the PR; exit≠0
      (incomplete) goes back to document until the list is complete.
    command: "node \"$AIDAKIT_GOVERNANCE/validators/check-doc-manifest.js\" \".aidakit/tasks/${context.select.change_id}/doc-manifest.json\""
    on_success: pr
    on_failure: document

  - id: pr
    type: invoke
    description: commit + PR via commit-commands. Stops at the PR URL — never merges.
    invoke_target: aidakit:ship
    expects:
      - success
      - failure
    on_success: merge
    on_failure: aborted

  - id: merge
    type: human_gate
    description: Human GATE — the merge is always human (GOVERNANCE.md §1).
    prompt: |
      PR ready for ${inputs.request}. Review it on the git host and do the merge yourself.
      Then, confirm here for the orchestrator to archive the change.
    options:
      - merged
      - discard
    on_result:
      merged: done
      discard: aborted

  - id: done
    type: terminal
    outcome: completed
    message: "Change delivered and merged. aidakit:docs archives and promotes specs."

  - id: aborted
    type: terminal
    outcome: aborted
    message: "Flow interrupted before the merge."
