flow: full
description: |
  Full flow, codeflow/psim style: maximum rigor for broad, architectural, or
  irreversible work. Adversarial brainstorm that grills the owner BEFORE spending
  tokens; spec with an independent critic; pre-apply gate; implementation;
  adversarial bench review (capped rounds); hardening; learning; PR; and the human
  merge gate. The rich mechanics (brainstorm, review-bench, learn) are skills these
  steps invoke — the order lives here, the behavior in the skills.
version: 1

inputs:
  - name: request
    type: string
    required: true
    description: Free-form description of what to build.

steps:
  - id: select
    type: invoke
    description: |
      aidakit:orchestrator — picks/confirms the change ready to build. Detects the
      tracking mode (OpenSpec in openspec/changes/ or docs/features/), inspects the
      active changes, runs git log for the repo state, checks the archive
      (openspec/changes/archive/ or docs/archive/) and the cited dependencies, and picks
      the first ready change whose plan artifacts validate and whose dependencies have
      already been delivered. If the request already carries a change-id, it confirms it
      instead of selecting. Reports the resolved change-id back as the change_id
      output (resume ... success change_id=<kebab-case-id>): every downstream
      .aidakit/tasks/... and .aidakit/dna/... path keys on
      ${context.select.change_id}, never on the free-form ${inputs.request}.
    invoke_target: aidakit:orchestrator
    input:
      request: "${inputs.request}"
    expects:
      - success
      - failure
    outputs:
      success:
        - change_id
    on_success: classify
    on_failure: aborted

  - id: classify
    type: invoke
    description: aidakit:identify-domain — classifies domain×type×flags (selects the brainstorm ammunition and the review matrix).
    invoke_target: aidakit:identify-domain
    input:
      request: "${inputs.request}"
    expects:
      - success
      - failure
    on_success: brainstorm
    on_failure: aborted

  - id: brainstorm
    type: invoke
    description: aidakit:brainstorm — default-on adversarial grill against the domain's ammunition, before spending spec tokens.
    invoke_target: aidakit:brainstorm
    input:
      request: "${inputs.request}"
      domain: "${context.classify.outcome}"
    expects:
      - done
      - skipped
    on_result:
      done: specify
      skipped: specify

  - id: specify
    type: invoke
    description: aidakit:plan — authors proposal/design/tasks from the brainstorm (plan-only).
    invoke_target: aidakit:plan
    expects:
      - success
      - failure
    on_success: commit_plan
    on_failure: aborted

  - id: commit_plan
    type: runs
    description: |
      EARLY PLAN COMMIT (ADR-009, completing ADR-007) — the moment the plan is
      authored, commit docs/features/<id>/ so the roadmap derives in-progress from
      the SHARED git state, visible from any worktree/clone and not only the tree
      that wrote it. BEST-EFFORT and FAIL-SAFE: keyed on ${context.select.change_id}
      (env-passed data, ADR-006). When change_id is populated it stages exactly that
      change's dir and commits (skipping an empty commit); when it is absent the
      `test -n` guard short-circuits — the command no-ops, never stages a bare
      docs/features/, never loops — and the flow proceeds. Both outcomes route to
      critic: a commit hiccup must not block the feature (aidakit:ship commits the
      rest at the pr step). change_id populates reliably once flow-request-vs-change-id
      lands; until then this step simply no-ops on the runs that don't report it.
    command: "test -n \"${context.select.change_id}\" && git add \"docs/features/${context.select.change_id}\" && { git diff --cached --quiet || git commit -q -m \"plan(${context.select.change_id}): author proposal/design/tasks\"; } || true"
    on_success: critic
    on_failure: critic

  - id: critic
    type: invoke
    description: aidakit:spec-reviewer (independent critic) — audits the spec before the gate.
    invoke_target: aidakit:spec-reviewer
    expects:
      - ok
      - revise
    on_result:
      ok: pre_apply
      revise: specify

  - id: pre_apply
    type: human_gate
    description: Pre-apply GATE — short summary in plain language; the owner releases the implementation.
    prompt: |
      I'm going to build for "${inputs.request}". Review the plan summary above
      (what, assumed premises, dubious items). Do I release the implementation?
    options:
      - yes
      - no
    on_result:
      yes: readiness
      no: aborted

  - id: readiness
    type: invoke
    description: aidakit:readiness — mechanical GATE 1 for the plan package's readiness.
    invoke_target: aidakit:readiness
    expects:
      - approved
      - needs-revision
      - blocked
    on_result:
      approved: implement
      needs-revision: specify
      blocked: aborted

  - id: implement
    type: invoke
    description: Implementation with TDD; post-phase reflection feeds the learning.
    invoke_target: aidakit:implement
    expects:
      - success
      - failure
    on_success: check_implement_bench
    on_failure: aborted

  - id: check_implement_bench
    type: runs
    description: |
      PARALLELISM LEASH, conditional — a single-surface change never writes a
      bench="implement" record to .aidakit/tasks/<change-id>/bench.ndjson
      (there's nothing to parallelize; the file may still exist for the review
      bench that runs later), so this step SKIPS the leash when no "implement"
      record is present (exit 0). When the orchestrator routed a multi-surface
      change in parallel mode, aidakit:implement wrote the bench manifest +
      per-surface verdicts under bench="implement", and check-bench.js verifies
      the same three things as the review bench: every manifested surface
      reported, the consensus matches what aidakit:implement reported, and the
      dispatch was genuinely parallel. The path keys on
      ${context.select.change_id} — the id select reported — never on the
      free-form request.
    command: "test ! -f \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" || ! grep -q '\"bench\":\"implement\"' \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" || node \"$AIDAKIT_GOVERNANCE/validators/check-bench.js\" \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" --bench implement --outcome success"
    on_success: review_bench
    on_failure: implement

  - id: review_bench
    type: invoke
    description: aidakit:review — adversarial bench summoned by a role×flag matrix, capped rounds; consensus gates the advance.
    invoke_target: aidakit:review
    expects:
      - consensus
      - rejected
    on_result:
      consensus: check_review_bench
      rejected: check_review_bench

  - id: check_review_bench
    type: runs
    description: |
      PARALLELISM LEASH — check-bench mechanically verifies the review bench:
      every role the __manifest__ record committed to (written BEFORE dispatch)
      reported exactly once; the mechanical consensus derived from the roles'
      own verdicts matches what aidakit:review reported; and the roles'
      dispatch/return windows genuinely overlap (real parallel dispatch, not
      sequential). exit 0 (gate released) proceeds per the reported outcome;
      exit≠0 (leash violation) goes back to review_bench to redo the round
      properly — a bench that skipped a role, invented a consensus, or ran
      sequentially never reaches hardening.
    command: "node \"$AIDAKIT_GOVERNANCE/validators/check-bench.js\" \".aidakit/tasks/${context.select.change_id}/bench.ndjson\" --bench review --outcome \"${context.review_bench.outcome}\""
    on_success: bench_outcome
    on_failure: review_bench

  - id: bench_outcome
    type: runs
    description: Routes on the bench's own reported outcome now that check_review_bench has verified it mechanically.
    command: "test \"${context.review_bench.outcome}\" = consensus"
    on_success: hardening
    on_failure: implement

  - id: hardening
    type: invoke
    description: Late hardening — full suite, anti-hardcode, hard DoD (only after the owner validates the functionality).
    invoke_target: aidakit:test
    expects:
      - success
      - failure
    on_success: learn
    on_failure: implement

  - id: learn
    type: invoke
    description: |
      aidakit:learn — consolidates learnings (PROPOSES updates), records ledgers; does
      not block. High-confidence learnings (an error recurring ≥3x via
      deriveCandidates) are CRYSTALLIZED into executable DNA (test/rule) in staging
      .aidakit/dna/${context.select.change_id}/ — promoted by a DEDICATED PR, not the feature's.
    invoke_target: aidakit:learn
    input:
      request: "${inputs.request}"
      change_id: "${context.select.change_id}"
    expects:
      - success
      - failure
    on_success: dna_gate
    on_failure: dna_gate

  # --- DNA side branch: NEVER blocks the feature. If there is no crystallized DNA,
  # it goes straight to document. If there is, it validates freshness and opens its own PR.
  - id: dna_gate
    type: runs
    description: |
      Is there crystallized DNA in staging for this change? Routes the side branch.
      exit 0 = there is DNA (proceeds to dna_freshness) · exit 1 = nothing to promote
      (skips straight to document, the feature flow stays untouched).
    command: "test -d \".aidakit/dna/${context.select.change_id}\" && [ -n \"$(ls -A \".aidakit/dna/${context.select.change_id}\" 2>/dev/null)\" ]"
    on_success: dna_freshness
    on_failure: document

  - id: dna_freshness
    type: runs
    description: |
      Invalidation GATE — check-dna-freshness confirms that no crystallized DNA was
      born obsolete (origin premise/ADR already superseded) or malformed. exit 0
      releases the DNA PR; exit≠0 goes back to learn to revalidate/regenerate the DNA.
    command: "node \"$AIDAKIT_GOVERNANCE/validators/check-dna-freshness.js\" \".aidakit/dna/${context.select.change_id}\""
    on_success: dna_pr
    on_failure: learn

  - id: dna_pr
    type: invoke
    description: |
      aidakit:ship in DNA MODE — commits the artifacts from .aidakit/dna/${context.select.change_id}/
      on a DEDICATED branch (aidakit/dna/${context.select.change_id}) and its OWN PR, separate from the
      feature's PR (don't mix evolving-the-process with delivering-the-product). Stops at the URL.
    invoke_target: aidakit:ship
    input:
      request: "${inputs.request}"
      change_id: "${context.select.change_id}"
      mode: "dna"
      branch: "aidakit/dna/${context.select.change_id}"
    expects:
      - success
      - failure
    on_success: document
    on_failure: document

  - id: document
    type: invoke
    description: |
      aidakit:doc-planner — DOC-LEASH. Assembles/updates the change's mandatory-documents
      manifest (.aidakit/tasks/${context.select.change_id}/doc-manifest.json) and dispatches
      the fronts that fill the missing docs. Decides the rigor (what is mandatory, with what
      condition and kind — in the full flow, architecture REQUIRES an ADR); the truth remains the disk.
    invoke_target: aidakit:doc-planner
    input:
      request: "${inputs.request}"
      change_id: "${context.select.change_id}"
    expects:
      - success
      - failure
    on_success: check_docs
    on_failure: aborted

  - id: check_docs
    type: runs
    description: |
      LEASH GATE — check-doc-manifest checks item by item and LOCKS the flow until the
      list is 100%. exit 0 (gate released) proceeds to the PR; exit≠0 (incomplete) goes
      back to document until the list closes.
    command: "node \"$AIDAKIT_GOVERNANCE/validators/check-doc-manifest.js\" \".aidakit/tasks/${context.select.change_id}/doc-manifest.json\""
    on_success: pr
    on_failure: document

  - id: pr
    type: invoke
    description: commit + PR via commit-commands. Stops at the PR URL.
    invoke_target: aidakit:ship
    expects:
      - success
      - failure
    on_success: merge_route
    on_failure: aborted

  - id: merge_route
    type: runs
    description: |
      Routes the tail by config. exit 0 = pr.auto_merge is on (attempts the
      autonomous merge) · exit≠0 = absent/false/error (falls into today's
      human_gate). Fail-closed toward the human — read via the single-source
      helper (governance/pr/pr-config.js) shared with the hooks/pre-bash.js
      gh-pr-merge carve-out, so the two never diverge (ADR-008).
    command: "node \"$AIDAKIT_GOVERNANCE/validators/check-pr-automation.js\" --field auto_merge"
    on_success: auto_merge
    on_failure: merge

  - id: auto_merge
    type: invoke
    description: |
      aidakit:merge — OPT-IN autonomous merge (ADR-008; opt-in read from the base
      branch, never this PR's own diff). Confirms mergeability on the host and
      merges via the host's normal mechanism (gh pr merge, no --admin/--no-verify/
      bypass). Any doubt/failure (not mergeable, gh not
      configured, no permission, branch protection, changes-requested) →
      outcome blocked/failure → falls into the human_gate below, reporting why.
    invoke_target: aidakit:merge
    input:
      request: "${inputs.request}"
      change_id: "${context.select.change_id}"
    expects:
      - merged
      - blocked
      - failure
    on_result:
      merged: done
      blocked: merge
      failure: merge

  - id: merge
    type: human_gate
    description: Human GATE — the merge is always the human's.
    prompt: |
      PR ready for "${inputs.request}". Merge it on the git host and confirm.
    options:
      - merged
      - discard
    on_result:
      merged: done
      discard: aborted

  - id: done
    type: terminal
    outcome: completed
    message: "Change delivered with full rigor, merged and learned."

  - id: aborted
    type: terminal
    outcome: aborted
    message: "Full flow interrupted."
