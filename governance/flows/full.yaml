flow: full
description: |
  Full flow, codeflow/psim style: maximum rigor for broad, architectural, or
  irreversible work. Adversarial brainstorm that grills the owner BEFORE spending
  tokens; spec with an independent critic; pre-apply gate; implementation;
  adversarial bench review (capped rounds); hardening; learning; PR; and the human
  merge gate. The rich mechanics (brainstorm, review-bench, learn) are skills these
  steps invoke — the order lives here, the behavior in the skills.
version: 1

inputs:
  - name: request
    type: string
    required: true
    description: Free-form description of what to build.

steps:
  - id: select
    type: invoke
    description: |
      aidakit:orchestrator — picks/confirms the change ready to build. Detects the
      tracking mode (OpenSpec in openspec/changes/ or docs/features/), inspects the
      active changes, runs git log for the repo state, checks the archive
      (openspec/changes/archive/ or docs/archive/) and the cited dependencies, and picks
      the first ready change whose plan artifacts validate and whose dependencies have
      already been delivered. If the request already carries a change-id, it confirms it
      instead of selecting.
    invoke_target: aidakit:orchestrator
    input:
      request: "${inputs.request}"
    expects:
      - success
      - failure
    on_success: classify
    on_failure: aborted

  - id: classify
    type: invoke
    description: aidakit:identify-domain — classifies domain×type×flags (selects the brainstorm ammunition and the review matrix).
    invoke_target: aidakit:identify-domain
    input:
      request: "${inputs.request}"
    expects:
      - success
      - failure
    on_success: brainstorm
    on_failure: aborted

  - id: brainstorm
    type: invoke
    description: aidakit:brainstorm — default-on adversarial grill against the domain's ammunition, before spending spec tokens.
    invoke_target: aidakit:brainstorm
    input:
      request: "${inputs.request}"
      domain: "${context.classify.outcome}"
    expects:
      - done
      - skipped
    on_result:
      done: specify
      skipped: specify

  - id: specify
    type: invoke
    description: aidakit:plan — authors proposal/design/tasks from the brainstorm (plan-only).
    invoke_target: aidakit:plan
    expects:
      - success
      - failure
    on_success: critic
    on_failure: aborted

  - id: critic
    type: invoke
    description: aidakit:spec-reviewer (independent critic) — audits the spec before the gate.
    invoke_target: aidakit:spec-reviewer
    expects:
      - ok
      - revise
    on_result:
      ok: pre_apply
      revise: specify

  - id: pre_apply
    type: human_gate
    description: Pre-apply GATE — short summary in plain language; the owner releases the implementation.
    prompt: |
      I'm going to build for "${inputs.request}". Review the plan summary above
      (what, assumed premises, dubious items). Do I release the implementation?
    options:
      - yes
      - no
    on_result:
      yes: readiness
      no: aborted

  - id: readiness
    type: invoke
    description: aidakit:readiness — mechanical GATE 1 for the plan package's readiness.
    invoke_target: aidakit:readiness
    expects:
      - approved
      - needs-revision
      - blocked
    on_result:
      approved: implement
      needs-revision: specify
      blocked: aborted

  - id: implement
    type: invoke
    description: Implementation with TDD; post-phase reflection feeds the learning.
    invoke_target: aidakit:implement
    expects:
      - success
      - failure
    on_success: review_bench
    on_failure: aborted

  - id: review_bench
    type: invoke
    description: aidakit:review — adversarial bench summoned by a role×flag matrix, capped rounds; consensus gates the advance.
    invoke_target: aidakit:review
    expects:
      - consensus
      - rejected
    on_result:
      consensus: hardening
      rejected: implement

  - id: hardening
    type: invoke
    description: Late hardening — full suite, anti-hardcode, hard DoD (only after the owner validates the functionality).
    invoke_target: aidakit:test
    expects:
      - success
      - failure
    on_success: learn
    on_failure: implement

  - id: learn
    type: invoke
    description: |
      aidakit:learn — consolidates learnings (PROPOSES updates), records ledgers; does
      not block. High-confidence learnings (an error recurring ≥3x via
      deriveCandidates) are CRYSTALLIZED into executable DNA (test/rule) in staging
      .aidakit/dna/${inputs.request}/ — promoted by a DEDICATED PR, not the feature's.
    invoke_target: aidakit:learn
    input:
      request: "${inputs.request}"
    expects:
      - success
      - failure
    on_success: dna_gate
    on_failure: dna_gate

  # --- DNA side branch: NEVER blocks the feature. If there is no crystallized DNA,
  # it goes straight to document. If there is, it validates freshness and opens its own PR.
  - id: dna_gate
    type: runs
    description: |
      Is there crystallized DNA in staging for this change? Routes the side branch.
      exit 0 = there is DNA (proceeds to dna_freshness) · exit 1 = nothing to promote
      (skips straight to document, the feature flow stays untouched).
    command: "test -d .aidakit/dna/${inputs.request} && [ -n \"$(ls -A .aidakit/dna/${inputs.request} 2>/dev/null)\" ]"
    on_success: dna_freshness
    on_failure: document

  - id: dna_freshness
    type: runs
    description: |
      Invalidation GATE — check-dna-freshness confirms that no crystallized DNA was
      born obsolete (origin premise/ADR already superseded) or malformed. exit 0
      releases the DNA PR; exit≠0 goes back to learn to revalidate/regenerate the DNA.
    command: "node governance/validators/check-dna-freshness.js .aidakit/dna/${inputs.request}"
    on_success: dna_pr
    on_failure: learn

  - id: dna_pr
    type: invoke
    description: |
      aidakit:ship in DNA MODE — commits the artifacts from .aidakit/dna/${inputs.request}/
      on a DEDICATED branch (aidakit/dna/${inputs.request}) and its OWN PR, separate from the
      feature's PR (don't mix evolving-the-process with delivering-the-product). Stops at the URL.
    invoke_target: aidakit:ship
    input:
      request: "${inputs.request}"
      mode: "dna"
      branch: "aidakit/dna/${inputs.request}"
    expects:
      - success
      - failure
    on_success: document
    on_failure: document

  - id: document
    type: invoke
    description: |
      aidakit:doc-planner — DOC-LEASH. Assembles/updates the change's mandatory-documents
      manifest (.aidakit/tasks/${inputs.request}/doc-manifest.json) and dispatches the fronts
      that fill the missing docs. Decides the rigor (what is mandatory, with what condition
      and kind — in the full flow, architecture REQUIRES an ADR); the truth remains the disk.
    invoke_target: aidakit:doc-planner
    input:
      request: "${inputs.request}"
    expects:
      - success
      - failure
    on_success: check_docs
    on_failure: aborted

  - id: check_docs
    type: runs
    description: |
      LEASH GATE — check-doc-manifest checks item by item and LOCKS the flow until the
      list is 100%. exit 0 (gate released) proceeds to the PR; exit≠0 (incomplete) goes
      back to document until the list closes.
    command: "node governance/validators/check-doc-manifest.js .aidakit/tasks/${inputs.request}/doc-manifest.json"
    on_success: pr
    on_failure: document

  - id: pr
    type: invoke
    description: commit + PR via commit-commands. Stops at the PR URL.
    invoke_target: aidakit:ship
    expects:
      - success
      - failure
    on_success: merge
    on_failure: aborted

  - id: merge
    type: human_gate
    description: Human GATE — the merge is always the human's.
    prompt: |
      PR ready for "${inputs.request}". Merge it on the git host and confirm.
    options:
      - merged
      - discard
    on_result:
      merged: done
      discard: aborted

  - id: done
    type: terminal
    outcome: completed
    message: "Change delivered with full rigor, merged and learned."

  - id: aborted
    type: terminal
    outcome: aborted
    message: "Full flow interrupted."
